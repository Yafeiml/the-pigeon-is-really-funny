[package]
name = "pigeon"
version = "0.1.0"
edition = "2024"
description = "A native Windows desktop pigeon with hand-tuned 2D animation"
repository = "https://github.com/Yafeiml/the-pigeon-is-really-funny"
license = "MIT"

[features]
default = ["painted"]
painted = []
standalone = ["painted", "windows/Win32_System_Memory", "windows/Win32_System_SystemInformation",
    "windows/Win32_Networking_WinHttp", "windows/Win32_Storage_FileSystem",
    "dep:semver", "dep:serde_json", "dep:sha2"]

[dependencies]

[target.'cfg(windows)'.dependencies]
semver = { version = "1", optional = true }
serde_json = { version = "1", optional = true }
sha2 = { version = "0.10", optional = true }
windows-numerics = "0.3.1"
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct2D", "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11",
    "Win32_Graphics_DirectComposition", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi", "Win32_Graphics_Imaging",
    "Win32_Security",
    "Win32_System_Com", "Win32_System_LibraryLoader", "Win32_System_Threading",
    "Win32_UI_Controls", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
